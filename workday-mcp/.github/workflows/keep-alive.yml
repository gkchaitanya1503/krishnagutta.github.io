name: Keep Codespace Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:        # Manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          # Set your Codespace URL here or use a repository variable
          URL="${{ vars.CODESPACE_URL }}"
          if [ -z "$URL" ]; then
            echo "⚠ CODESPACE_URL variable not set. Go to Settings → Variables → Actions → New variable"
            echo "  Name: CODESPACE_URL"
            echo "  Value: https://YOUR-CODESPACE-4000.app.github.dev"
            exit 0
          fi

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --retry 2 --retry-delay 3 "$URL/health" || echo "000")

          if [ "$STATUS" = "200" ]; then
            echo "✅ Codespace is alive ($URL)"
          elif [ "$STATUS" = "000" ]; then
            echo "⚠ Connection timeout — Codespace may be stopped."
            echo "  Restart: open the Codespace and run 'npm run reload'"
          else
            echo "⚠ HTTP $STATUS — Codespace may be starting up."
          fi
